<!-- public/TechWaves.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <filter id="turbulence">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.010 0.020"
      numOctaves="3"
      seed="41"
      result="noise">
      <animate attributeName="baseFrequency"
        dur="10s"
        values="0.010 0.020; 0.012 0.018; 0.009 0.021; 0.010 0.020"
        repeatCount="indefinite" />
      <animate attributeName="seed" dur="12s" values="8;9;8" repeatCount="indefinite" />
    </feTurbulence>

    <feDisplacementMap in="SourceGraphic" in2="noise" scale="75" xChannelSelector="R" yChannelSelector="G" />
  </filter>

  <!-- This rectangle is what gets distorted into “waves” -->
  <rect x="-200" y="-200" width="1600" height="1200" fill="rgba(255,255,255,0.9)" filter="url(#turbulence)" />
</svg>
